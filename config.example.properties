# Free My TV settings. build.sh copies this file to config.properties the first time; edit that one and rebuild.

# Free key from https://www.themoviedb.org/settings/api (the "API Read Access Token" or the "API Key").
# Without it, the home screen still works, just without the trending picks.
tmdb_key=

# Apps on the home shelf, in order (optional; empty = the default order, only the ones installed show, up to 8).
# netflix, smarttube, youtube, prime, disney, max, appletv, hulu, paramount, peacock, globoplay, spotify
shelf=

# "Your Taste" tab (optional): titles you love, comma-separated (any language), and genres you like
# (ficção científica, ação, guerra, crime, drama, comédia, terror, suspense, animação... or in English).
taste_titles=
taste_genres=

# Your country (two letters): decides which titles are on which streaming app. US, GB, CA, BR, DE, FR...
tmdb_region=US

# Your city, for the weather and the sunset that turns the home screen dark at night (decimal degrees).
latitude=40.7128
longitude=-74.0060
# Optional: the name shown on the weather card (empty = "Weather").
city=

# auto (follows the TV), en or pt
language=auto

# Exchange rates (dollar, euro, pound, yuan) in: BRL, USD, EUR...
currency=USD

# C, F, or auto (Fahrenheit when the TV is set to the US)
temperature=auto

# Music screen (optional, needs Spotify Premium): your app's Client ID from developer.spotify.com/dashboard (Redirect
# URI http://127.0.0.1:8888/callback), then run: python3 -I tools/spotify_login.py (it fills the token in).
spotify_client_id=
spotify_refresh_token=

# auto (light by day, dark after sunset), dark or light
theme=auto

# true also turns off Google Assistant ("Ok Google"); the remote's mic button stops working
disable_assistant=false
